[package]
name = "claude-ps"
version = "0.1.0"
edition = "2024"
description = "ps for Claude Code, joined to the zellij pane each agent runs in"
license = "MIT"
repository = "https://github.com/lorenzolfm/claude-ps"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
