name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One job for each derivation on each OS, so the runners work in
      # parallel. A single `nix flake check` puts every gate behind one log and
      # one runner. src/proc has one backend for each OS, and each backend is
      # only exercised on its own kernel: ubuntu is x86_64-linux and macos-15
      # is aarch64-darwin.
      matrix:
        os:
          [
            ubuntu-24.04,
            macos-15,
          ]
        gate:
          [
            claude-ps,
            claude-ps-clippy,
            claude-ps-test,
            claude-ps-fmt,
          ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # flake.lock pins each tool, and rust-toolchain.toml pins the compiler.
      # An unchanged tree is therefore a substitution from cache.nixos.org and
      # not a new build. No installer step chooses a different version.
      - run: nix build --print-build-logs ".#${{ matrix.gate }}"
